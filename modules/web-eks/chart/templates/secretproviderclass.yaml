# Mounts the Secrets Manager secret as files, using the pod's Pod Identity role.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: admin-credentials
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: {{ .Values.adminSecretArn | quote }}
        objectType: secretsmanager
        objectAlias: admin
        jmesPath:
          - path: username
            objectAlias: username
          - path: password
            objectAlias: password
