# Manually tear down the dev environment to stop all charges.
# Requires typing "destroy" and approval on the production environment.
name: Terraform destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to delete all dev environment resources'
        required: true

permissions:
  contents: read

concurrency:
  group: terraform-refs/heads/main
  cancel-in-progress: false

env:
  TF_VERSION: "1.12.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_WORKING_DIR: environments/dev

jobs:
  destroy:
    name: Destroy
    if: github.event.inputs.confirm == 'destroy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      TF_VAR_ssh_allowed_cidrs: ${{ secrets.SSH_ALLOWED_CIDRS }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This repository is public, so its Actions logs are too. Mask the
      # trusted IP (as it appears inside the CIDR list) and the alarm email.
      - name: Mask personal inputs in logs
        run: |
          for cidr in $(jq -r '.[]' <<<"${TF_VAR_ssh_allowed_cidrs}"); do
            echo "::add-mask::${cidr}"
            echo "::add-mask::${cidr%/*}"
          done
          echo "::add-mask::${TF_VAR_alarm_email}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${AWS_REGION}"

      - name: terraform destroy
        run: terraform destroy -auto-approve
