# CI/CD for the Hello World stack.
#
#   pull request -> validate (fmt, validate, tflint, unit tests) -> plan
#   push to main -> validate -> plan -> [manual approval] apply -> smoke test
#
# Plan, apply and smoke test only run once the bootstrap stack is applied and
# the repository variables are configured (see README, "CI/CD setup").
name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments against the same state at once.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.12.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_WORKING_DIR: environments/dev

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          for dir in environments/*/ modules/*/; do
            echo "::group::validate ${dir}"
            terraform -chdir="${dir}" init -backend=false
            terraform -chdir="${dir}" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="${GITHUB_WORKSPACE}/.tflint.hcl"
          tflint --recursive --config="${GITHUB_WORKSPACE}/.tflint.hcl" --format=compact

      - name: terraform test (unit tests, mocked AWS)
        run: |
          for tests in modules/*/tests environments/*/tests; do
            [ -d "${tests}" ] || continue
            dir=$(dirname "${tests}")
            echo "::group::test ${dir}"
            terraform -chdir="${dir}" test
            echo "::endgroup::"
          done

      - name: shellcheck
        run: shellcheck tests/*.sh

  plan:
    name: Plan
    needs: validate
    # Skip until CI is configured, and for pull requests from forks (which
    # cannot request OIDC tokens).
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      TF_VAR_ssh_allowed_cidrs: ${{ secrets.SSH_ALLOWED_CIDRS }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This repository is public, so its Actions logs are too. Mask the
      # trusted IP (as it appears inside the CIDR list) and the alarm email.
      - name: Mask personal inputs in logs
        run: |
          for cidr in $(jq -r '.[]' <<<"${TF_VAR_ssh_allowed_cidrs}"); do
            echo "::add-mask::${cidr}"
            echo "::add-mask::${cidr%/*}"
          done
          echo "::add-mask::${TF_VAR_alarm_email}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${AWS_REGION}"

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -out=tfplan
          exit_code=$?
          set -e
          # 0 = no changes, 1 = error, 2 = changes present
          if [ "${exit_code}" -eq 1 ]; then exit 1; fi
          if [ "${exit_code}" -eq 2 ]; then has_changes=true; else has_changes=false; fi
          echo "has_changes=${has_changes}" >> "${GITHUB_OUTPUT}"

      # Resource actions only: the full plan (with attribute values) stays in
      # the masked job log.
      - name: Publish plan summary
        run: |
          {
            echo "### Terraform plan (\`${TF_WORKING_DIR}\`)"
            echo '```'
            terraform show -no-color tfplan | grep -E '^  # |^Plan:|^No changes' || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The exact plan that was reviewed is what gets applied. The admin
      # password is write-only, so the plan file contains no secrets.
      - name: Upload plan
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 5

  apply:
    name: Apply
    needs: plan
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # Required reviewers on this environment provide the manual approval gate.
    # The apply role trusts only this environment's OIDC subject.
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      TF_VAR_ssh_allowed_cidrs: ${{ secrets.SSH_ALLOWED_CIDRS }}
      TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This repository is public, so its Actions logs are too. Mask the
      # trusted IP (as it appears inside the CIDR list) and the alarm email.
      - name: Mask personal inputs in logs
        run: |
          for cidr in $(jq -r '.[]' <<<"${TF_VAR_ssh_allowed_cidrs}"); do
            echo "::add-mask::${cidr}"
            echo "::add-mask::${cidr%/*}"
          done
          echo "::add-mask::${TF_VAR_alarm_email}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${AWS_REGION}"

      - name: terraform apply
        run: terraform apply tfplan

  smoke-test:
    name: Smoke test
    needs: [plan, apply]
    # Runs after a successful apply, and also on main when there was nothing to
    # apply, so every push to main verifies the live application.
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.plan.result == 'success' &&
      (needs.apply.result == 'success' || needs.apply.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Read-only role: the smoke test only observes.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform -chdir="${TF_WORKING_DIR}" init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${AWS_REGION}"

      - name: Smoke test the deployment through the ALB
        run: tests/smoke_test.sh "${TF_WORKING_DIR}"
